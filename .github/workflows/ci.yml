name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .
          python -m pip check
          python -m pip freeze --all

      - name: Ruff
        run: |
          python -m ruff format --check .
          python -m ruff check . --output-format=github

      - name: Pytest (coverage gate)
        run: |
          python -m pytest -q --cov=src --cov-fail-under=75

      - name: Security (pip-audit)
        run: |
          python scripts/audit_dependencies.py

  docker:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: fraud-risk-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - name: Docker build-context canaries
        run: python3 scripts/check_docker_context.py

      - name: Build test stage
        run: |
          docker build --target test -t fraud-risk-ops:test .

      - name: Docker Compose smoke test
        run: |
          docker compose config --quiet
          docker compose up -d --build
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/live; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS http://127.0.0.1:8000/metrics | head -n 5

      - name: Verify test and runtime image inputs
        run: |
          python3 scripts/check_docker_context.py --images fraud-risk-ops:test fraud-risk-ops-api:local fraud-risk-ops-worker:local fraud-risk-ops-ui:local

      - name: Redis and separate worker integration
        run: python3 scripts/check_redis_worker.py

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose down -v

  secret_history:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks full reachable Git history (redacted)
        run: |
          docker run --rm \
            --mount "type=bind,src=$PWD,dst=/repo,readonly" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --no-banner --redact --log-opts="--all" /repo
