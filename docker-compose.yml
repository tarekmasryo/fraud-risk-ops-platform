services:
  api:
    build:
      context: .
      target: api
    image: fraud-risk-ops-api:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=compose
      - LOG_FORMAT=json
      - DATABASE_URL=sqlite:///./data/fraud_ops.db
      - REDIS_URL=redis://redis:6379/0
      - MAX_BATCH_RECORDS=1000
      - REQUIRE_AUTH=false
      - ALLOW_LOCAL_FALLBACK=false
      - STRICT_ARTIFACT_RUNTIME=true
      - ALLOW_ARTIFACT_COMPATIBILITY_FALLBACK=false
      - RUN_JOBS_IN_API=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - fraud_data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      target: api
    image: fraud-risk-ops-worker:local
    command: ["python", "-m", "fraud_dashboard.workers.worker"]
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=compose
      - LOG_FORMAT=json
      - DATABASE_URL=sqlite:///./data/fraud_ops.db
      - REDIS_URL=redis://redis:6379/0
      - RUN_JOBS_IN_API=false
      - STRICT_ARTIFACT_RUNTIME=true
      - ALLOW_ARTIFACT_COMPATIBILITY_FALLBACK=false
      - WORKER_POLL_SECONDS=2
    volumes:
      - fraud_data:/app/data
    depends_on:
      - redis
      - api
    restart: unless-stopped

  ui:
    build:
      context: .
      target: ui
    image: fraud-risk-ops-ui:local
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - FRAUD_API_URL=http://api:8000
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_PORT=8501
      - ALLOW_LOCAL_FALLBACK=false
      - STRICT_ARTIFACT_RUNTIME=true
      - ALLOW_ARTIFACT_COMPATIBILITY_FALLBACK=false
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  fraud_data:
  grafana_data:
